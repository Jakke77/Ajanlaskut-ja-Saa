plugins { id 'com.android.application' }
android {
    namespace 'fi.jakke77.saawidget'
    compileSdk 35
    defaultConfig { applicationId 'fi.jakke77.saawidget'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303'; testImplementation 'org.robolectric:robolectric:4.14.1' }
