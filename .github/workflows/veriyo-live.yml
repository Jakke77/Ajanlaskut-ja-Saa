name: Veriyo Live packages
on:
  push:
    branches: [codex/veriyo-live]
    paths: ['live/**', '.github/workflows/veriyo-live.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned runtime and wheels
        shell: pwsh
        run: |
          python -m pip install ziglang==0.15.2
          python -m pip download --dest downloads --platform win_amd64 --python-version 312 --implementation cp --abi cp312 --only-binary=:all: -r live/packaging/requirements-windows.txt
          python -c "import urllib.request; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip','downloads/python-3.12.10-embed-amd64.zip')"
      - name: Build independent Windows ZIP
        shell: pwsh
        run: |
          $zigPath = python -c "import ziglang; from pathlib import Path; print(Path(ziglang.__file__).with_name('zig.exe'))"
          python live/packaging/build.py windows --output outputs --cache downloads --zig $zigPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged Windows runtime and native adapters without changing wallpaper
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $root = (Get-ChildItem outputs -Directory | Where-Object Name -Like '*Windows*' | Select-Object -First 1).FullName
          & "$root/runtime/python.exe" "$root/main.py" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root/runtime/python.exe" "$root/main.py" --export "$root/check.png" --at 2026-10-27T21:00:00+02:00
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $root
          & './runtime/python.exe' -c "from veriyo_live.platforms import WindowsBackend; assert isinstance(WindowsBackend().desktop_path(),str); print('PASS: native SystemParametersInfoW read')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $parseErrors = $null
          $tokens = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root 'veriyo_live/lock-screen.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          Write-Output 'PASS: lock helper PowerShell syntax (actual locked desktop not tested)'
          Pop-Location
      - name: Upload Windows ZIP to prepared draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0,'live'); from veriyo_live import VERSION; print(VERSION)"
          $tag = "veriyo-live-v$version"
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Prepared draft missing.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-ChildItem outputs -Filter '*.zip' | Select-Object -First 1
          Copy-Item outputs/SHA256SUMS outputs/SHA256SUMS-Windows.txt
          gh release upload $tag --repo $env:GITHUB_REPOSITORY $zip.FullName outputs/SHA256SUMS-Windows.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veriyo-Live-Windows
          path: outputs/*.zip
